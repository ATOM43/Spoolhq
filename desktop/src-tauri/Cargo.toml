[package]
name = "spoolhq-desktop"
version = "0.0.0"
description = "SpoolHQ desktop app"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The _lib suffix keeps the library's name apart from the binary's (a Windows
# requirement for Cargo, see https://github.com/rust-lang/cargo/issues/8519).
name = "spoolhq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
dirs = "=6.0.0"
# Sink/Stream traits for the WebSocket (already in the tree through Tauri).
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
# Plain HTTP to 127.0.0.1 only: no TLS, no proxy support, HTTP/1.1.
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
# The New project dialog's folder picker; the capability allows only `open`.
tauri-plugin-dialog = "=2.8.3"
tokio = { version = "=1.53.3", features = ["macros", "sync", "time"] }
# The daemon's event WebSocket, plain ws:// to 127.0.0.1 only: no TLS features.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
toml = "=1.1.8"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["net", "rt"] }

[lints.clippy]
# Pedantic, enabled alone at its default threshold (100 lines); `just lint` denies warnings.
too_many_lines = "warn"
