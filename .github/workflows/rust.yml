name: Rust

on:
  push:
    paths:
      - desktop/src-tauri/**
      - rust-toolchain.toml
      - justfile
      - .github/workflows/**
      - scripts/**
      - daemon/uv.lock
      - desktop/pnpm-lock.yaml
      - desktop/src-tauri/Cargo.lock
  pull_request:
    paths:
      - desktop/src-tauri/**
      - rust-toolchain.toml
      - justfile
      - .github/workflows/**
      - scripts/**
      - daemon/uv.lock
      - desktop/pnpm-lock.yaml
      - desktop/src-tauri/Cargo.lock

permissions:
  contents: read

# One group per workflow and branch: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Headers and libraries Tauri compiles against on Linux (no installer packages).
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # rustup is preinstalled on every runner; this installs the toolchain pinned in
      # rust-toolchain.toml, with clippy and rustfmt.
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
      # Also installs just: the rust-just wheel on PyPI, pinned and kept in the uv cache
      # (the GitHub release download failed with HTTP 504).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: .github/workflows/rust.yml
          cache-suffix: just
      - run: uv tool install rust-just==1.59.0
      # tauri-build needs the externalBin file to exist; an empty one stands in for
      # the daemon, which the package workflow builds (docs/packaging.md).
      - run: just sidecar-placeholder
      - run: just lint-rust test-rust
      # A debug build of the app (no installers or bundles; those come with release tags).
      - run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked
