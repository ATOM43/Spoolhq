name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

# One group per workflow and branch: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux only: these checks give the same result on every OS (docs/decisions/core.md).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also installs just: the rust-just wheel on PyPI, pinned and kept in the uv cache
      # (the GitHub release download failed with HTTP 504).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: |
            daemon/uv.lock
            .github/workflows/lint.yml
          cache-suffix: lint
      - run: uv tool install rust-just==1.59.0
      # pnpm/action-setup reads the version from packageManager in desktop/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/.node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: just install
      - run: just lint-daemon lint-desktop
