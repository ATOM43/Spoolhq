name: Release

# Installers for Linux, Windows and macOS with a signed update feed (docs/packaging.md).
# A v* tag makes a draft GitHub Release; a dry run uploads workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, upload artifacts, make no release
        type: boolean
        default: true
      pubkey:
        description: Update public key to build with instead of tauri.conf.json's (dry runs only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # true for a dry run; a tag push has no inputs.
  DRY_RUN: ${{ inputs.dry_run == true }}
  # tauri build refuses to sign without a public key; before yours is in tauri.conf.json
  # a dry run can pass a throwaway one (docs/packaging.md). Read by release.py check-feed.
  UPDATER_PUBKEY: ${{ inputs.dry_run == true && inputs.pubkey || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing secrets
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret; see docs/packaging.md"
            exit 1
          fi
          if [ -z "$PASSWORD" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret; see docs/packaging.md"
            exit 1
          fi
      # Versions agree, the tag is v<version>, the update public key is set, and the tag is
      # annotated with the release notes (checkout drops a tag's annotation, so fetch it).
      - name: Tag and version
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          python3 scripts/release.py check-tag "$GITHUB_REF_NAME"

  build:
    needs: check
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner GitHub offers, so the AppImage runs on glibc 2.35+.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, bundles: "appimage,deb,rpm" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, bundles: nsis }
          - { os: macos-26, target: aarch64-apple-darwin, platform: darwin-aarch64, bundles: "app,dmg" }
          - { os: macos-26-intel, target: x86_64-apple-darwin, platform: darwin-x86_64, bundles: "app,dmg" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # No x86_64 macOS wheel of cryptography: it builds against Homebrew's OpenSSL, and the
      # runner's Python brings an older libssl that PyInstaller bundles in its place. uv's
      # Python links OpenSSL statically, so nothing clashes.
      UV_PYTHON_PREFERENCE: ${{ matrix.target == 'x86_64-apple-darwin' && 'only-managed' || 'managed' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust job's packages plus patchelf for the AppImage and rpm to list the package.
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: release
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: |
            daemon/uv.lock
            .github/workflows/release.yml
          cache-suffix: release
      - run: uv tool install rust-just==1.59.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: desktop/.node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: just install-desktop
      # The real sidecar for this OS (never the placeholder), checked for dev tools.
      - run: just build-daemon
      - name: Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config=()
          if [ -n "$UPDATER_PUBKEY" ]; then
            [[ "$UPDATER_PUBKEY" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "::error::pubkey isn't base64"; exit 1; }
            printf '{"plugins":{"updater":{"pubkey":"%s"}}}' "$UPDATER_PUBKEY" > "$RUNNER_TEMP/pubkey.json"
            config=(--config "$RUNNER_TEMP/pubkey.json")
          fi
          pnpm --dir desktop tauri build --ci --bundles "${{ matrix.bundles }}" "${config[@]}"
      # Installers to dist/ with unique names, and this platform's latest-<platform>.json.
      - name: Collect
        run: uv run --no-project --python 3.12 python scripts/release.py collect ${{ matrix.target }} dist
      - name: Feed lists this platform, signed
        shell: bash
        run: uv run --no-project --python 3.12 python scripts/release.py check-feed dist/latest-${{ matrix.platform }}.json ${{ matrix.platform }}

      # The sidecar is inside each bundle; the T23 smoke test runs against the bundled copy.
      - name: Check the Linux bundles
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -c dist/*.deb | grep -E ' (\./)?usr/bin/spoolhq$'
          rpm -qlp dist/*.rpm | grep -x /usr/bin/spoolhq
          chmod +x dist/*.AppImage
          mkdir -p "$RUNNER_TEMP/appimage"
          cp dist/*.AppImage "$RUNNER_TEMP/appimage/app.AppImage"
          (cd "$RUNNER_TEMP/appimage" && ./app.AppImage --appimage-extract > /dev/null)
          echo "SIDECAR=$RUNNER_TEMP/appimage/squashfs-root/usr/bin/spoolhq" >> "$GITHUB_ENV"
      # Every binary in the AppImage, the sidecar's bundled libraries included, runs on
      # glibc 2.35 (Ubuntu 22.04, Debian 12+, Fedora 36+).
      - name: Check the glibc version
        if: runner.os == 'Linux'
        run: |
          uv run --directory daemon --locked --group build python ../scripts/check_glibc.py 2.35 \
            "$GITHUB_WORKSPACE"/dist/*.AppImage "$RUNNER_TEMP/appimage/squashfs-root"
      - name: Check the macOS bundle
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          cp -R "$RUNNER_TEMP/dmg/SpoolHQ.app" "$RUNNER_TEMP/SpoolHQ.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "SIDECAR=$RUNNER_TEMP/SpoolHQ.app/Contents/MacOS/spoolhq" >> "$GITHUB_ENV"
      # The NSIS installer, run silently into a temp folder.
      - name: Check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "SpoolHQ"
          Start-Process -Wait -FilePath $setup -ArgumentList "/S", "/D=$dir"
          "SIDECAR=$dir\spoolhq.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Smoke test the bundled daemon
        shell: bash
        run: |
          test -f "$SIDECAR"
          uv run --directory daemon --locked python ../scripts/smoke_sidecar.py "$SIDECAR"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      # The release notes are the tag's message (the check job refused a tag without one).
      - name: Notes
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run of $GITHUB_SHA" > notes.txt
          else
            git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          fi
      - name: latest.json
        run: |
          python3 scripts/release.py merge latest.json notes.txt dist/latest-*.json
          rm dist/latest-*.json
          mv latest.json dist/
          python3 scripts/release.py check-feed dist/latest.json linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64
          ls -l dist
      - if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
      - name: Draft release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "SpoolHQ $GITHUB_REF_NAME" --notes-file notes.txt dist/*
