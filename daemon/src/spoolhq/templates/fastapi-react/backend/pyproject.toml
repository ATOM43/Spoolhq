[project]
name = "backend"
version = "0.1.0"
description = "The API."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

# Not a distributable package: uv installs only the dependencies.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default rules plus import sorting, pyupgrade, bugbear and the security checks (S).
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true

[tool.importlinter]
root_package = "app"
# Needed so contracts can forbid third-party packages (FastAPI, Starlette).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api on top of services, services on top of core"
type = "layers"
layers = ["app.main", "app.api", "app.services", "app.core"]

[[tool.importlinter.contracts]]
name = "services never import FastAPI or Starlette"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core imports nothing from api or services"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.services", "fastapi", "starlette"]
