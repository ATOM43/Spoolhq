[project]
name = "spoolhq"
version = "0.0.0"
description = "SpoolHQ daemon: turns a written spec into a ticket plan and runs a coding agent on it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "ruamel-yaml==0.19.1",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
spool = "spoolhq.cli:app"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default rules plus import sorting, pyupgrade, bugbear and the security checks
# (flake8-bandit) that catch shell=True and similar.
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Plain assert is how pytest tests are written.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.importlinter]
root_package = "spoolhq"
# Needed so contracts can forbid third-party packages (FastAPI, Typer, ...).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli and api on top of services, services on top of core"
type = "layers"
layers = [
    "spoolhq.cli",
    "spoolhq.api",
    "spoolhq.services",
    "spoolhq.core",
]

[[tool.importlinter.contracts]]
name = "core imports nothing from api, cli or services"
type = "forbidden"
source_modules = ["spoolhq.core"]
forbidden_modules = ["spoolhq.api", "spoolhq.cli", "spoolhq.services"]

[[tool.importlinter.contracts]]
name = "services never import web or CLI frameworks"
type = "forbidden"
source_modules = ["spoolhq.services"]
forbidden_modules = ["fastapi", "starlette", "typer", "uvicorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: starts a real daemon in a subprocess (runs in CI on Linux, macOS and Windows)",
]

# `just test` adds --cov=spoolhq --cov-fail-under=85. Only TYPE_CHECKING blocks are
# excluded; this replaces coverage's defaults, so `# pragma: no cover` has no effect.
[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
